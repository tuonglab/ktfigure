    <circle cx="535" cy="100" r="61" fill="url(#cell)" stroke="#75629c" stroke-width="3"/>
    <ellipse cx="535" cy="101" rx="24" ry="20" fill="url(#nucleus)"/>
    <circle cx="92" cy="323" r="62" fill="url(#cell)" stroke="#75629c" stroke-width="3"/>
    <circle cx="92" cy="323" r="25" fill="url(#nucleus)"/>
    <circle cx="541" cy="319" r="53" fill="url(#cell)" stroke="#75629c" stroke-width="3"/>
    <ellipse cx="541" cy="319" rx="24" ry="19" fill="url(#nucleus)"/>
  </g>
  <g fill="#e1afc5" stroke="#a4719d" stroke-width="2">
