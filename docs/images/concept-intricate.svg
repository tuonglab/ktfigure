    <radialGradient id="nucleus"><stop stop-color="#a077c4"/><stop offset="1" stop-color="#594d91"/></radialGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e7f2ef"/></linearGradient>
  </defs>
  <rect width="640" height="420" fill="url(#background)"/>
  <g fill="none" stroke="#99a1c9" stroke-width="2" opacity=".8">
