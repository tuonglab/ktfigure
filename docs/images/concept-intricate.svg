<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="title desc">
  <title id="title">An unnecessarily intricate study concept</title>
  <desc id="desc">Decorative cells and tangled lines overwhelm a small sampling schedule.</desc>
