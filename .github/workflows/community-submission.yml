name: Prepare community figure

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare:
    if: startsWith(github.event.issue.title, '[Gallery]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/gallery-requirements.txt
      - run: python -m pip install -r .github/scripts/gallery-requirements.txt
      - name: Validate and compress submission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          python .github/scripts/community_gallery.py submit --issue "$RUNNER_TEMP/issue.json"
      - name: Open a review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          branch="community/figure-$ISSUE_NUMBER-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/community/items
          git commit -m "Add community figure $ISSUE_NUMBER" -m "Co-authored-by: copilot-swe-agent[bot] <198982749+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$BASE_BRANCH" \
            --title "Add community figure #$ISSUE_NUMBER" \
            --body "Review the image and submission in #$ISSUE_NUMBER before merging. Older gallery entries may be removed to enforce the 200-image limit."
      - name: Report a failed submission
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "We couldn't prepare this submission automatically. Please check that it contains one GitHub-uploaded JPEG or PNG under 10 MiB and that the permission box is checked. A maintainer can inspect the Actions run for details."
