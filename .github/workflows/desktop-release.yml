name: Build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            asset: ktfigure-windows-x64.zip
          - name: macOS Apple silicon
            runner: macos-15
            platform: macos
            asset: ktfigure-macos-arm64.zip
          - name: macOS Intel
            runner: macos-15-intel
            platform: macos
            asset: ktfigure-macos-x64.zip
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            asset: ktfigure-linux-x64.tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb python3-tk python3-venv tk-dev libx11-6 libxext6 libxrender1 libxft2 libfontconfig1
          python3 -m venv "$RUNNER_TEMP/ktfigure-build"
          echo "$RUNNER_TEMP/ktfigure-build/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: python -m pip install ".[gpu]" "pyinstaller>=6,<7"
      - name: Build application
        shell: bash
        run: >-
          python -m PyInstaller --noconfirm --clean --windowed --name ktfigure --hidden-import PIL._tkinter_finder --collect-all vispy --collect-all glfw
          --add-data "src/ktfigure/images:ktfigure/images"
          .github/scripts/desktop_entry.py
      - name: Package application
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/ktfigure -DestinationPath release/${{ matrix.asset }}"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/ktfigure.app "release/${{ matrix.asset }}"
          else
            tar -C dist -czf "release/${{ matrix.asset }}" ktfigure
          fi
      - name: Test packaged application
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir extracted
          if [ "${{ matrix.platform }}" = "windows" ]; then
            powershell -NoProfile -Command "Expand-Archive -Path release/${{ matrix.asset }} -DestinationPath extracted"
            executable="extracted/ktfigure/ktfigure.exe"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ditto -x -k "release/${{ matrix.asset }}" extracted
            executable="extracted/ktfigure.app/Contents/MacOS/ktfigure"
          else
            tar -xzf "release/${{ matrix.asset }}" -C extracted
            executable="extracted/ktfigure/ktfigure"
          fi
          tests=(--smoke-test --gpu-smoke-test)
          if [ "${{ matrix.platform }}" != "linux" ]; then
            set +e
            python -c '
          import glfw, sys
          if not glfw.init():
              sys.exit(42)
          try:
              glfw.window_hint(glfw.VISIBLE, glfw.FALSE)
              window = glfw.create_window(64, 64, "OpenGL probe", None, None)
              if not window:
                  sys.exit(42)
              glfw.destroy_window(window)
          finally:
              glfw.terminate()
          '
            probe_status=$?
            set -e
            if [ "$probe_status" -eq 42 ]; then
              echo "::warning::This runner cannot create an OpenGL context; only GPU imports are checked. Test GPU rendering on a physical machine."
              tests=(--smoke-test --gpu-import-test)
            elif [ "$probe_status" -ne 0 ]; then
              exit "$probe_status"
            fi
          fi
          for test in "${tests[@]}"; do
            args=("$executable" "$test")
            if [ "$test" = "--gpu-smoke-test" ]; then
              args+=("gpu-smoke-error.log")
            fi
            if [ "${{ matrix.platform }}" = "linux" ]; then
              runner=(xvfb-run -a)
            else
              runner=()
            fi
            if ! "${runner[@]}" python -c 'import subprocess, sys; subprocess.run(sys.argv[1:], check=True, timeout=120)' "${args[@]}"; then
              if [ -f gpu-smoke-error.log ]; then cat gpu-smoke-error.log; fi
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --generate-notes
